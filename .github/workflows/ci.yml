name: Build and checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 scripts/test_native.py --compiler g++
      - run: python3 scripts/check_public.py
      - run: python3 -m py_compile scripts/prepare_meshcore.py scripts/test_native.py
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.2.0
      - name: Configure compile-only placeholders
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('lib/LTEUpdate/src')
          for stem in ('LTEDeploymentConfig', 'TrustAnchor', 'TrustedKey'):
              shutil.copyfile(root / (stem + '.example.h'), root / (stem + '.h'))
          PY
      - run: python scripts/prepare_meshcore.py
      - run: pio run -d build/MeshCore -e Xiao_S3_WIO_repeater_lte_hwtest
