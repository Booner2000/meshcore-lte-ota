name: Native checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 scripts/test_native.py --compiler g++
      - run: python3 -m py_compile scripts/prepare_meshcore.py scripts/test_native.py
