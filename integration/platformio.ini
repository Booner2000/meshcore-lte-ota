; Phase 1 keeps the original board, partition table, WLAN OTA and admin path.
[env:Xiao_S3_WIO_repeater_lte]
extends = env:Xiao_S3_WIO_repeater
lib_deps =
  ${env:Xiao_S3_WIO_repeater.lib_deps}
  symlink://lib/LTEUpdate
build_flags =
  ${env:Xiao_S3_WIO_repeater.build_flags}
  -D WITH_LTE_OTA=1
  -D LTE_MODEM_POWER_CONTROL=0
  -D LTE_MODEM_SLEEP_CONTROL=0
; S polarity is known: HIGH=awake, LOW=sleep allowed after AT+CSCLK=1.
; No S GPIO assigned until separately agreed. Candidate GPIO2/D1.

[env:Xiao_S3_WIO_repeater_lte_disabled]
extends = env:Xiao_S3_WIO_repeater_lte
build_flags =
  ${env:Xiao_S3_WIO_repeater.build_flags}
  -D WITH_LTE_OTA=0

; Bench test only: the explicitly agreed S connection is XIAO D1/GPIO2.
; External power remains untouched. Upload requires separate authorization.
[env:Xiao_S3_WIO_repeater_lte_hwtest]
extends = env:Xiao_S3_WIO_repeater_lte
build_flags =
  ${env:Xiao_S3_WIO_repeater.build_flags}
  -D WITH_LTE_OTA=1
  -D LTE_MODEM_POWER_CONTROL=0
  -D LTE_MODEM_SLEEP_CONTROL=1
  -D LTE_MODEM_SLEEP_PIN=2
  -D LTE_MODEM_S_AWAKE_HIGH=1
  -D LTE_HARDWARE_DIAGNOSTICS=1
